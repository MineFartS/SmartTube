
plugins {
    id 'com.android.library'
}

repositories {
    google()
    mavenCentral()
}

android {

    compileSdkVersion 33
    
    defaultConfig {
        minSdkVersion 21
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['java']
        }
    }

}
